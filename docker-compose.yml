# MySewa full stack — run from repo root: docker compose up --build
# App: http://localhost:8080  |  Admin bootstrap: see .env.example

services:
  mysql:
    image: mysql:8.0
    container_name: mysewa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-mysewa}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 25s
    ports:
      - '${MYSQL_PUBLISH_PORT:-3307}:3306'

  api:
    build:
      context: ./spring-api
      dockerfile: Dockerfile
    container_name: mysewa-api
    restart: unless-stopped
    environment:
      SERVER_PORT: 8090
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-mysewa}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@localhost}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-Admin123}
      # ToyyibPay (optional — see docs/PAYMENTS.md). Callback needs a public API URL (e.g. ngrok).
      APP_PUBLIC_API_URL: ${APP_PUBLIC_API_URL:-http://127.0.0.1:8090}
      TOYYIBPAY_ENABLED: ${TOYYIBPAY_ENABLED:-false}
      TOYYIBPAY_SANDBOX: ${TOYYIBPAY_SANDBOX:-true}
      TOYYIBPAY_USER_SECRET_KEY: ${TOYYIBPAY_USER_SECRET_KEY:-}
      TOYYIBPAY_CATEGORY_CODE: ${TOYYIBPAY_CATEGORY_CODE:-}
      PAYMENT_MANUAL_BANK_NAME: ${PAYMENT_MANUAL_BANK_NAME:-}
      PAYMENT_MANUAL_BANK_ACCOUNT: ${PAYMENT_MANUAL_BANK_ACCOUNT:-}
      PAYMENT_MANUAL_BANK_HOLDER: ${PAYMENT_MANUAL_BANK_HOLDER:-}
      PAYMENT_MANUAL_QR_URL: ${PAYMENT_MANUAL_QR_URL:-}
      MYSEWA_DEV_RESET_DEPOSIT: ${MYSEWA_DEV_RESET_DEPOSIT:-false}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ./react-web
      # If "npm ci" fails with ECONNRESET: build React on host, set WEB_DOCKERFILE=Dockerfile.prebuilt in .env
      dockerfile: ${WEB_DOCKERFILE:-Dockerfile}
    container_name: mysewa-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - api

volumes:
  mysql_data:
  uploads_data:
