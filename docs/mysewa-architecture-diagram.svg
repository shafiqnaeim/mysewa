<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#333"/>
    </marker>
    <marker id="arrow-start" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto">
      <polygon points="10 0, 0 4, 10 8" fill="#333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="620" fill="#ffffff"/>

  <!-- Header -->
  <text x="24" y="34" font-size="14" fill="#666">PART 1</text>
  <text x="1100" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="end">MYSEWA | SHAFIQ IRFAN</text>
  <text x="24" y="72" font-size="22" font-weight="700" fill="#1a1a1a">Software Architecture (High Level)</text>

  <!-- Users -->
  <g transform="translate(40, 95)">
    <circle cx="28" cy="18" r="12" fill="none" stroke="#333" stroke-width="2"/>
    <circle cx="58" cy="12" r="10" fill="none" stroke="#333" stroke-width="2"/>
    <circle cx="88" cy="18" r="12" fill="none" stroke="#333" stroke-width="2"/>
    <path d="M16 42 Q28 28 40 42" fill="none" stroke="#333" stroke-width="2"/>
    <path d="M48 38 Q58 26 68 38" fill="none" stroke="#333" stroke-width="2"/>
    <path d="M76 42 Q88 28 100 42" fill="none" stroke="#333" stroke-width="2"/>
    <text x="58" y="68" font-size="13" font-weight="600" fill="#333" text-anchor="middle">Users:</text>
    <text x="58" y="86" font-size="12" fill="#444" text-anchor="middle">Student, Landlord,</text>
    <text x="58" y="102" font-size="12" fill="#444" text-anchor="middle">Administrator</text>
  </g>

  <!-- Users <-> Client arrows -->
  <line x1="150" y1="150" x2="200" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>

  <!-- TIER 1: Client Browser -->
  <rect x="200" y="108" width="300" height="88" rx="6" fill="#b8e8f4" stroke="#2d8fad" stroke-width="2"/>
  <text x="350" y="132" font-size="15" font-weight="700" fill="#0d4a5c" text-anchor="middle">Client (Browser)  Presentation Layer</text>
  <text x="220" y="156" font-size="12" fill="#1a4a57">" React SPA (Vite)</text>
  <text x="220" y="174" font-size="12" fill="#1a4a57">" HTML / CSS / JavaScript</text>
  <text x="220" y="192" font-size="12" fill="#1a4a57">" React Router " Nginx (static + /api proxy)</text>

  <!-- Client <-> API arrows + middle label -->
  <line x1="500" y1="152" x2="560" y2="152" stroke="#333" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
  <rect x="505" y="118" width="50" height="68" fill="#fff" opacity="0"/>
  <text x="530" y="132" font-size="10" fill="#333" text-anchor="middle">HTTP</text>
  <text x="530" y="146" font-size="10" fill="#333" text-anchor="middle">Requests</text>
  <text x="530" y="160" font-size="10" fill="#333" text-anchor="middle">JSON</text>
  <text x="530" y="174" font-size="10" fill="#333" text-anchor="middle">Exchange</text>

  <text x="680" y="118" font-size="11" fill="#444">Receive HTTP requests</text>
  <text x="680" y="134" font-size="11" fill="#444">Validate input data</text>
  <text x="680" y="150" font-size="11" fill="#444">Call service / repository layer</text>
  <text x="680" y="166" font-size="11" fill="#444">Return JSON responses</text>

  <!-- TIER 2: Spring Boot API -->
  <rect x="560" y="108" width="300" height="88" rx="6" fill="#f9c89b" stroke="#d97706" stroke-width="2"/>
  <text x="710" y="132" font-size="15" font-weight="700" fill="#7c2d12" text-anchor="middle">API Server (Spring Boot)  Application Layer</text>
  <text x="580" y="156" font-size="12" fill="#5c2a0a">" AuthController " PropertyController</text>
  <text x="580" y="174" font-size="12" fill="#5c2a0a">" ApplicationController " PaymentController</text>
  <text x="580" y="192" font-size="12" fill="#5c2a0a">" AdminController " ReviewController " UniversityController</text>

  <!-- API <-> Service arrows -->
  <line x1="710" y1="196" x2="710" y2="248" stroke="#333" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
  <text x="730" y="228" font-size="11" fill="#444">Method Calls</text>

  <!-- TIER 2b: Service & Data Access -->
  <rect x="200" y="248" width="660" height="108" rx="6" fill="#c8e6c9" stroke="#43a047" stroke-width="2"/>
  <text x="530" y="272" font-size="15" font-weight="700" fill="#1b5e20" text-anchor="middle">Service &amp; Data Access Layer</text>
  <text x="220" y="296" font-size="12" fill="#2e4a2f">" Entity models: UserAccount, PropertyEntity, Application, UniversityEntity</text>
  <text x="220" y="314" font-size="12" fill="#2e4a2f">" Services: AuthService, MailService, CampusProximityService</text>
  <text x="220" y="332" font-size="12" fill="#2e4a2f">" JPA Repositories " JWT authentication " Business logic</text>
  <text x="220" y="350" font-size="12" fill="#2e4a2f">" Utility: IcCryptoService (IC encryption)</text>

  <!-- Service <-> DB arrows + middle label -->
  <line x1="530" y1="356" x2="530" y2="408" stroke="#333" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
  <text x="560" y="388" font-size="11" fill="#444">SQL via JPA / Hibernate</text>
  <text x="380" y="388" font-size="11" fill="#444">Data representation</text>
  <text x="380" y="404" font-size="11" fill="#444">CRUD operations " Validation</text>

  <!-- TIER 3: MySQL -->
  <rect x="200" y="408" width="660" height="120" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
  <text x="530" y="438" font-size="16" font-weight="700" fill="#b71c1c" text-anchor="middle">Database (MySQL 8)  Data Layer</text>
  <!-- Simple MySQL dolphin hint -->
  <ellipse cx="250" cy="478" rx="28" ry="18" fill="#00758f" opacity="0.15"/>
  <text x="250" y="483" font-size="11" font-weight="700" fill="#00758f" text-anchor="middle">MySQL</text>
  <text x="320" y="468" font-size="12" fill="#4a1515">" users</text>
  <text x="320" y="486" font-size="12" fill="#4a1515">" properties</text>
  <text x="320" y="504" font-size="12" fill="#4a1515">" applications</text>
  <text x="480" y="468" font-size="12" fill="#4a1515">" property_reviews</text>
  <text x="480" y="486" font-size="12" fill="#4a1515">" financial_transactions</text>
  <text x="480" y="504" font-size="12" fill="#4a1515">" universities</text>
  <text x="700" y="468" font-size="12" fill="#4a1515">" application_rent_month_records</text>
  <text x="700" y="486" font-size="12" fill="#4a1515">" property_tenant_reports</text>

  <!-- Three-tier summary (left) -->
  <rect x="40" y="248" width="130" height="200" rx="6" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>
  <text x="105" y="272" font-size="12" font-weight="700" fill="#333" text-anchor="middle">Three-Tier</text>
  <text x="105" y="292" font-size="11" fill="#555" text-anchor="middle">1. Presentation</text>
  <text x="105" y="310" font-size="11" fill="#555" text-anchor="middle">2. Application</text>
  <text x="105" y="328" font-size="11" fill="#555" text-anchor="middle">3. Data</text>
  <line x1="55" y1="342" x2="155" y2="342" stroke="#ccc"/>
  <text x="105" y="362" font-size="10" fill="#666" text-anchor="middle">Deployed via</text>
  <text x="105" y="378" font-size="10" fill="#666" text-anchor="middle">Docker Compose</text>
  <text x="105" y="394" font-size="10" fill="#666" text-anchor="middle">(web + api + mysql)</text>
  <text x="105" y="418" font-size="10" fill="#666" text-anchor="middle">Production: VPS</text>

  <!-- REST API note -->
  <text x="530" y="560" font-size="11" fill="#666" text-anchor="middle">REST API base path: /api/v1/...  "  Client never connects to MySQL directly</text>

  <text x="1076" y="608" font-size="12" fill="#999" text-anchor="end">MySewa  Spring Boot + React architecture</text>
</svg>
