# Cursor@UMT production profile — activate with SPRING_PROFILES_ACTIVE=cursor on the server.
# Replace s12345 with your matric in env vars or override -Dcursor.matric when building the WAR.

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME:s12345_mysewa}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kuala_Lumpur
    username: ${DB_USER:s12345}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update

app:
  upload:
    base-dir: ${APP_UPLOAD_DIR:/home/s12345/uploads}
  auth:
    base-url: ${APP_BASE_URL:https://s12345.cursor.umt.edu.my}
  payment:
    public-api-base-url: ${APP_PUBLIC_API_URL:https://s12345.cursor.umt.edu.my}
    front-return-base: ${APP_BASE_URL:https://s12345.cursor.umt.edu.my}
    dev-allow-deposit-reset: false
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
