# Separate from servlet WAR — run on port 8090 so Tomcat (8080) can stay as-is during migration.

spring:
  application:
    name: mysewa-spring-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:mysewa.fyp@gmail.com}
    password: ${MAIL_PASSWORD:rzfe stxx oxlz prfw}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:mysewa}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kuala_Lumpur
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: ${SERVER_PORT:8090}

app:
  upload:
    base-dir: ${APP_UPLOAD_DIR:uploads}
  auth:
    jwt-secret: ${JWT_SECRET:mySecretKey}
    base-url: ${APP_BASE_URL:http://localhost:5173}
  security:
    # 32+ chars recommended; shorter values are hashed to a 256-bit key. Override in production.
    ic-encryption-key: ${MYSEWA_IC_ENCRYPTION_KEY:}
  payment:
    # Public URL of this API (ToyyibPay server-to-server callback). Localhost will not receive callbacks — use ngrok or deploy.
    public-api-base-url: ${APP_PUBLIC_API_URL:https://kathrin-shotten-janay.ngrok-free.dev}
    front-return-base: ${APP_BASE_URL:http://localhost:5173}
    manual:
      # Override in .env — defaults match PaymentProperties.java demo strings
      bank-name: ${PAYMENT_MANUAL_BANK_NAME:Maybank}
      bank-account: ${PAYMENT_MANUAL_BANK_ACCOUNT:151240496561}
      bank-holder: ${PAYMENT_MANUAL_BANK_HOLDER:MUHAMMAD SHAFIQ IRFAN BIN MOHD NAIM}
      # Optional: direct HTTPS URL to a PNG/JPEG the student’s browser can load (see docs/PAYMENTS.md)
      qr-image-url: ${PAYMENT_MANUAL_QR_URL:}
    toyyibpay:
      enabled: ${TOYYIBPAY_ENABLED:true}
      sandbox: ${TOYYIBPAY_SANDBOX:true}
      user-secret-key: ${TOYYIBPAY_USER_SECRET_KEY:xlabjavo-q49m-895u-n47q-letkx6v8mcs3}
      category-code: ${TOYYIBPAY_CATEGORY_CODE:sqvxlc8i}
    # Local QA only: student can clear deposit rows to re-test ToyyibPay / manual deposit. Never enable in production.
    dev-allow-deposit-reset: ${MYSEWA_DEV_RESET_DEPOSIT:false}
  mail:
    from: ${MAIL_FROM:mysewa.fyp@gmail.com}
  # On each startup: create admin if missing, or reconcile existing user to admin + synced password + verified.
  admin:
    # Local dev defaults — override with APP_ADMIN_EMAIL / APP_ADMIN_PASSWORD in .env for real deploys.
    # Sign-in: use this email or the login alias "admin" (see AuthService).
    email: ${APP_ADMIN_EMAIL:admin@localhost}
    password: ${APP_ADMIN_PASSWORD:Admin123}
