# Separate from servlet WAR — run on port 8090 so Tomcat (8080) can stay as-is during migration.

spring:
  application:
    name: mysewa-spring-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:mysewa}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kuala_Lumpur
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: ${SERVER_PORT:8090}

app:
  auth:
    jwt-secret: ${JWT_SECRET:mySecretKey}
    base-url: ${APP_BASE_URL:http://localhost:5173}
  security:
    # 32+ chars recommended; shorter values are hashed to a 256-bit key. Override in production.
    ic-encryption-key: ${MYSEWA_IC_ENCRYPTION_KEY:}
  payment:
    public-api-base-url: ${APP_PUBLIC_API_URL:}
    front-return-base: ${APP_BASE_URL:http://localhost:5173}
    manual:
      bank-name: ${PAYMENT_MANUAL_BANK_NAME:}
      bank-account: ${PAYMENT_MANUAL_BANK_ACCOUNT:}
      bank-holder: ${PAYMENT_MANUAL_BANK_HOLDER:}
      qr-image-url: ${PAYMENT_MANUAL_QR_URL:}
    toyyibpay:
      enabled: ${TOYYIBPAY_ENABLED:false}
      sandbox: ${TOYYIBPAY_SANDBOX:true}
      user-secret-key: ${TOYYIBPAY_USER_SECRET_KEY:}
      category-code: ${TOYYIBPAY_CATEGORY_CODE:}
    dev-allow-deposit-reset: ${MYSEWA_DEV_RESET_DEPOSIT:false}
  mail:
    from: ${MAIL_FROM:mysewa.fyp@gmail.com}
    support: ${MAIL_SUPPORT:mysewa.fyp@gmail.com}
    verification-expiry-hours: ${MAIL_VERIFICATION_EXPIRY_HOURS:24}
    password-reset-expiry-minutes: ${MAIL_PASSWORD_RESET_EXPIRY_MINUTES:30}
  admin:
    email: ${APP_ADMIN_EMAIL:admin@localhost}
    password: ${APP_ADMIN_PASSWORD:Admin123}
  demo:
    enabled: ${MYSEWA_DEMO_ACCOUNTS:false}
    student:
      email: ${DEMO_STUDENT_EMAIL:student@demo.mysewa}
      password: ${DEMO_STUDENT_PASSWORD:Student123}
    landlord:
      email: ${DEMO_LANDLORD_EMAIL:landlord@demo.mysewa}
      password: ${DEMO_LANDLORD_PASSWORD:Landlord123}

logging:
  level:
    root: INFO
    com.mysewa: INFO
