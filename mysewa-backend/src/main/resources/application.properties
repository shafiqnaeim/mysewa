server.port=8090

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:mysewa}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kuala_Lumpur
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB

app.jwt.secret=${JWT_SECRET:mySecretKeyChangeMeInProduction1234567890}
app.jwt.expiration-ms=86400000
app.auth.auto-verify=${APP_AUTO_VERIFY:false}

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

app.admin.email=${APP_ADMIN_EMAIL:admin@localhost}
app.admin.password=${APP_ADMIN_PASSWORD:Admin123}
